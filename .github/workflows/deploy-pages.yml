name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: [worker/**, migrations/**, '**/*.md', ux/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          BASE_PATH: /keylime
          # Repository variable: your Worker URL.
          VITE_API_URL: ${{ vars.API_URL }}
          # Repository secret: your R2 public soundfont URL.
          VITE_SOUNDFONT_BASE_URL: ${{ secrets.VITE_SOUNDFONT_BASE_URL }}
        run: |
          test -n "$VITE_SOUNDFONT_BASE_URL" || {
            echo "::error::VITE_SOUNDFONT_BASE_URL is missing"
            exit 1
          }

          pnpm build

      - name: Prepare GitHub Pages files
        run: touch build/.nojekyll && cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
